name: QEMU boot test (runtime detection)

# Tier 2 CI: actually BOOTS a kernel in QEMU, insmod's av.ko via a
# minimal statically-linked init (tests/qemu-boot/init.c - no
# busybox/shell), and confirms EICAR execution is genuinely detected
# and killed - not just that everything compiles (that's
# build-matrix.yml's job). See README.md's "CI" section for why this
# is a separate job/workflow from the compile-only one: GitHub-hosted
# runners can't switch their host kernel, so this needs its own
# from-scratch kernel build + QEMU, and free-tier runners have
# unreliable /dev/kvm access, so this falls back to TCG (software
# emulation) when KVM isn't usable rather than requiring it.
#
# gcc only, not the full gcc+clang matrix build-matrix.yml runs -
# detection logic doesn't depend on which compiler built the kernel/
# module, only on runtime behavior, so doubling this job's (much
# heavier: full boot, not just compile) cost for that axis isn't
# worth it. Cross-compiler compile compatibility is already covered
# there.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Same job as build-matrix.yml's own load-kernel-matrix - reads
  # .github/kernel-versions.json and hands its "versions" array to the
  # qemu-boot job's matrix below via fromJSON(). Duplicated here rather
  # than shared across workflow files (GitHub Actions has no
  # cross-workflow job-dependency mechanism) so this job's kernel
  # version list can never drift from build-matrix.yml's - it used to
  # be its own hardcoded list that only got updated by hand, and
  # nothing kept it in sync with the versions build-matrix.yml was
  # actually testing. The KCONFIG steps below still diverge from that
  # job's (this one needs a bootable kernel, not just a compilable
  # one) - only the version numbers themselves are shared.
  load-kernel-matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - id: read
        run: echo "versions=$(jq -c '.versions' .github/kernel-versions.json)" >> "$GITHUB_OUTPUT"

  qemu-boot:
    needs: load-kernel-matrix
    # arm64-hosted (native) - av.ko now hooks __arm64_sys_* symbols and
    # reads arm64 pt_regs, so it must be built and booted against an
    # arm64 kernel tree. See build-matrix.yml's `build` job for the
    # same reasoning.
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # See load-kernel-matrix above - hand-edit
        # .github/kernel-versions.json if you need to add e.g. a one-off
        # version; edits there won't survive the next scheduled run.
        kernel_version: ${{ fromJSON(needs.load-kernel-matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          # qemu-system-arm (not qemu-system-x86) ships the
          # qemu-system-aarch64 binary this job actually invokes below,
          # on both Debian and Ubuntu.
          # The libnl/yara/fuzzy trio and pkg-config are avd's build
          # dependencies (see userspace/avd/Makefile's checkdeps
          # target), needed here because this job now boots avd itself
          # for the exec-gate integration case - see the initramfs
          # step below and issue #48.
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev qemu-system-arm cpio pkg-config \
            libnl-3-dev libnl-genl-3-dev libyara-dev libfuzzy-dev

      - name: Cache built kernel tree
        id: cache-kernel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: linux-${{ matrix.kernel_version }}-qemu-boot
          # Separate cache namespace from build-matrix.yml's - this
          # job's config is a superset (adds everything needed to
          # actually boot: console, initramfs, ELF exec, devtmpfs,
          # tmpfs - see below), not the same tree. Includes hashes of
          # this workflow file AND the kernel download/verify helper
          # build-matrix.yml learned this lesson the hard way (its own
          # CONFIG_64BIT fix needed a manual v5->v6 cache-key bump to
          # actually take effect): without this, editing the inline
          # `scripts/config` calls below would silently keep serving
          # whatever kernel tree was already cached under this key,
          # never rebuilding to match the new config.
          #
          # v3: arm64 port - x86_64-built cache entries (bzImage,
          # tinyconfig+CONFIG_64BIT hack) are useless for the
          # defconfig-based arm64/Image build below, so the arch switch
          # itself forces a cache-key bump, same as build-matrix.yml's
          # v7->v8 bump for the same reason.
          key: qemu-boot-kernel-tree-v3-${{ matrix.kernel_version }}-${{
            hashFiles('.github/workflows/qemu-boot-test.yml',
              '.github/scripts/verify-kernel-tarball.sh',
              '.github/scripts/kernel-autosigner.asc') }}

      - name: Download and build a bootable kernel
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          SRCDIR="linux-${{ matrix.kernel_version }}-qemu-boot"
          TARBALL="linux-${{ matrix.kernel_version }}.tar.xz"
          # Full cryptographic verification (issue #6): PGP-verifies
          # sha256sums.asc against kernel.org's pinned checksum-autosigner
          # key before trusting any hash from it, then sha256-verifies
          # the tarball - see verify-kernel-tarball.sh for the flow
          # (curl retry flags moved into the helper, unchanged).
          .github/scripts/verify-kernel-tarball.sh "${{ matrix.kernel_version }}" "$TARBALL"
          mkdir -p "$SRCDIR"
          tar -xf "$TARBALL" -C "$SRCDIR" --strip-components=1
          rm "$TARBALL"
          cd "$SRCDIR"
          # defconfig, not tinyconfig: unlike build-matrix.yml's
          # compile-only job, this one has to actually BOOT under
          # QEMU's -M virt machine, which means the GICv2/v3
          # interrupt controller, PSCI (CPU start/stop/power), the
          # ARM architected timer, and the virtio-mmio transport all
          # need to be in the kernel - tinyconfig (allnoconfig-based)
          # starts from zero and would need every one of those
          # hand-enumerated from memory with no way to boot-test the
          # result in this environment; arm64's defconfig already
          # turns them all on as the common case for exactly this
          # virt platform, so it's the safer starting point here.
          # CONFIG_64BIT needs no override on arm64 (unlike x86, it's
          # an unconditional def_bool y - there's no 32-bit sibling
          # ambiguity to correct for).
          make ARCH=arm64 defconfig
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_CRYPTO
          ./scripts/config --enable CONFIG_CRYPTO_HASH
          ./scripts/config --enable CONFIG_CRYPTO_MD5
          ./scripts/config --enable CONFIG_CRYPTO_SHA1
          ./scripts/config --enable CONFIG_CRYPTO_SHA256
          ./scripts/config --enable CONFIG_PROC_FS
          ./scripts/config --enable CONFIG_NET
          # ... plus what's needed to actually BOOT to a working init
          # and exec things, on top of just compiling: a console to
          # see anything at all, initramfs support, ELF exec (without
          # this, execve() of ANYTHING - including init itself - fails
          # outright), /dev + /tmp for init/eicar.com to live in, and
          # the syslog(2) syscall init.c uses to read dmesg (observed
          # directly in CI on the x86_64 build this was ported from:
          # without this explicit enable, init.c's
          # syslog(SYSLOG_ACTION_READ_ALL) call fails ENOSYS - not
          # reliably on by default the way it looked in earlier local
          # testing, so it's listed explicitly here rather than
          # assumed). CONFIG_KALLSYMS is pulled in automatically by
          # CONFIG_KPROBES (kprobes register by symbol name), so it
          # doesn't need to be listed explicitly.
          ./scripts/config --enable CONFIG_BINFMT_ELF
          ./scripts/config --enable CONFIG_BLK_DEV_INITRD
          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_SHMEM
          ./scripts/config --enable CONFIG_TMPFS
          ./scripts/config --enable CONFIG_TTY
          # PL011, not 8250: QEMU's -M virt machine wires up an ARM
          # PL011 UART (ttyAMA0), not the 8250/16550 (ttyS0) x86_64's
          # -kernel boot path uses - see the "Boot in QEMU" step's
          # console= arg below, which must match.
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011_CONSOLE
          ./scripts/config --enable CONFIG_PRINTK
          # avd's FAN_OPEN_EXEC_PERM exec gate (issue #2 / #48). The
          # second symbol is the one that matters and the one distro
          # kernels most often leave off: CONFIG_FANOTIFY alone can
          # only WATCH execs, never deny one, and fanotify_init() with
          # FAN_CLASS_CONTENT fails EINVAL without it - which avd
          # reports and then refuses to start, so a missing symbol here
          # surfaces as an avd startup failure rather than as a gate
          # that silently allows everything.
          ./scripts/config --enable CONFIG_FANOTIFY
          ./scripts/config --enable CONFIG_FANOTIFY_ACCESS_PERMISSIONS
          # AF_UNIX, for avd's control socket. defconfig has it, but so
          # does defconfig have most of the list above - spelled out
          # for the same reason: this job's boot must not depend on
          # what a given kernel version's defconfig happens to include.
          ./scripts/config --enable CONFIG_UNIX
          make ARCH=arm64 olddefconfig
          make ARCH=arm64 -j"$(nproc)" Image modules

      - name: Build av.ko against this kernel tree
        run: |
          set -euxo pipefail
          KDIR="$GITHUB_WORKSPACE/linux-${{ matrix.kernel_version }}-qemu-boot"
          make -C av KDIR="$KDIR" clean
          make -C av KDIR="$KDIR"

      - name: Build the static test init and assemble the initramfs
        run: |
          set -euxo pipefail
          cd tests/qemu-boot
          # No -march= override needed here the way the x86_64 build
          # this was ported from needed -march=x86-64: that flag
          # worked around QEMU's default CPU model lacking AVX, which
          # glibc's static-binary startup code unconditionally used on
          # that toolchain. arm64 has no equivalent baseline/AVX-style
          # mismatch between the plain arm64 gcc target and QEMU's
          # default -M virt CPU model.
          gcc -Wall -Wextra -static -O2 -o init init.c
          # See cold_launcher.c's own header comment for why this is a
          # separate binary at all.
          gcc -Wall -Wextra -static -O2 -o cold_launcher cold_launcher.c
          rm -rf root
          mkdir -p root/{proc,dev,tmp,sys}
          cp init root/init
          chmod 755 root/init
          cp cold_launcher root/cold_launcher
          chmod 755 root/cold_launcher
          cp "$GITHUB_WORKSPACE/av/av.ko" root/av.ko

          # ---- avd, for the exec-gate integration case (issue #48) ----
          # Built by its own Makefile with its normal flags, so what
          # boots here is the binary the project ships rather than a
          # test-only variant of it.
          make -C "$GITHUB_WORKSPACE/userspace/avd"
          cp "$GITHUB_WORKSPACE/userspace/avd/avd" root/avd
          chmod 755 root/avd

          # Everything else in this initramfs is `gcc -static`, so
          # until now it had no dynamic loader and no libraries at all.
          # avd is dynamically linked and deliberately stays that way:
          # static-linking it would mean booting a differently-built
          # binary (different hardening flags, a different libc path)
          # than the one that ships, which is the opposite of what an
          # integration test is for.
          #
          # The closure is COMPUTED from ldd rather than listed by
          # hand - yara alone pulls in libcrypto, libmagic and a whole
          # compression stack, and a hand-written list would rot into
          # an unexplained avd startup failure the first time one of
          # them gained a dependency.
          #
          # Each library is copied to the SAME absolute path it has on
          # the runner, which is what makes LD_LIBRARY_PATH
          # unnecessary: the interpreter baked into avd's PT_INTERP,
          # and every DT_NEEDED under it, resolve inside the initramfs
          # unchanged.
          ldd "$GITHUB_WORKSPACE/userspace/avd/avd"
          ldd "$GITHUB_WORKSPACE/userspace/avd/avd" \
            | awk '{ for (i = 1; i <= NF; i++) if ($i ~ /^\//) { print $i; break } }' \
            | sort -u \
            | while read -r lib; do
                mkdir -p "root$(dirname "$lib")"
                cp -L "$lib" "root$lib"
              done

          # avd's rules and corpora. Production rules plus
          # tests/fixtures/test.yar, staged exactly the way
          # tests/test_avd_socket.sh stages them: the fixture is what
          # convicts init.c's malicious sample, and its own header
          # explains why it must never reach a production rules dir.
          mkdir -p root/av-rules root/av-corpus
          cp "$GITHUB_WORKSPACE"/rules/heuristics.yar \
             "$GITHUB_WORKSPACE"/rules/elf_analysis.yar \
             "$GITHUB_WORKSPACE"/rules/entropy.yar \
             "$GITHUB_WORKSPACE"/tests/fixtures/test.yar \
             root/av-rules/
          cp "$GITHUB_WORKSPACE"/corpus/fuzzy_hashes.txt \
             "$GITHUB_WORKSPACE"/corpus/tlsh_hashes.txt \
             root/av-corpus/

          # -R root:root because cpio otherwise stamps the archive with
          # the ownership it sees on the runner, and the runner is not
          # root - every entry, including "." (which becomes the guest's
          # "/"), would land owned by uid 1001. That is not how a real
          # initramfs looks, and avd notices: dir_hierarchy_trusted()
          # walks a path's parents to "/" and refuses any directory an
          # unprivileged uid controls, so a 1001-owned "/" makes it
          # decline both its control socket and its quarantine dir. In
          # copy-out mode -R only sets the header values, so this needs
          # no privilege here.
          ( cd root && find . -print0 \
              | cpio --null -o -H newc -R root:root 2>/dev/null \
              | gzip -9 ) > initramfs.cpio.gz
          ls -la initramfs.cpio.gz

      - name: Boot in QEMU and check for detection
        run: |
          set -euxo pipefail
          cd tests/qemu-boot
          KDIR="$GITHUB_WORKSPACE/linux-${{ matrix.kernel_version }}-qemu-boot"

          # KVM access on GitHub-hosted runners is not guaranteed (see
          # this workflow's header comment) - use it when available for
          # speed, fall back to TCG (software emulation, slower but
          # always available) otherwise. Both are exercised and known
          # to work identically for this test.
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          # Array, not a plain string, so this doesn't depend on word
          # splitting an unquoted variable expansion later.
          if [ -w /dev/kvm ] 2>/dev/null; then
            ACCEL_ARGS=(-enable-kvm -cpu host)
            echo "Using KVM acceleration"
          else
            ACCEL_ARGS=(-accel tcg -cpu max)
            echo "KVM unavailable - falling back to TCG (software emulation)"
          fi

          # 300s, not the 90s this ran with before the exec-gate case
          # (#48) was added. That case starts avd inside the guest and
          # polls for up to 60s for the gate to arm, plus avd's own
          # startup (compiling the YARA rule set) and up to 15s for its
          # shutdown - all of which is cheap under KVM and emphatically
          # is not under TCG, which is the leg free-tier runners
          # actually take. A budget that clips the guest mid-test shows
          # up as "neither PASS nor FAIL", i.e. as a harness defect,
          # so it is set with room rather than tuned to the observed
          # time.
          timeout 300 qemu-system-aarch64 \
            -M virt \
            -kernel "$KDIR/arch/arm64/boot/Image" \
            -initrd initramfs.cpio.gz \
            -append "console=ttyAMA0 panic=-1" \
            -display none \
            -serial file:serial.log \
            -no-reboot \
            -m 512M \
            "${ACCEL_ARGS[@]}" \
          || true # timeout/halt-instead-of-poweroff exit is expected - see below

          echo "::group::Full serial console log"
          cat serial.log || true
          echo "::endgroup::"

          # init prints its final PASS/FAIL line, drains the console
          # (tcdrain - see init.c's drain_console(), sync() alone does
          # NOT flush a tty) and only then calls reboot(RB_POWER_OFF) -
          # on a kernel without ACPI poweroff support that just halts
          # the CPU rather than actually terminating QEMU, which is why
          # the command above is allowed to end via the `timeout`
          # wrapper instead of a clean exit; the log has already
          # captured everything that matters by then. What actually
          # gates pass/fail is the marker text below, not QEMU's own
          # exit code.
          if ! grep -q "QEMU_TEST: PASS" serial.log; then
            # Distinguish a real test failure from a truncated log. init
            # prints exactly one terminal marker, so "neither PASS nor
            # FAIL" means the verdict never made it out of the guest -
            # historically a UART FIFO discarded at poweroff, which made
            # a passing run look like a failing one (same commit, one
            # leg, not reproducible on rerun). Do not paper over this by
            # retrying: it means drain_console() stopped working.
            if grep -q "QEMU_TEST: FAIL" serial.log; then
              echo "::error::QEMU_TEST: FAIL reported by init - see log above"
            elif grep -q "QEMU_TEST: init started" serial.log; then
              echo "::error::serial log ends with no QEMU_TEST verdict - init" \
                   "booted but neither PASS nor FAIL reached the log." \
                   "Suspect console output lost at poweroff (init.c" \
                   "drain_console) or a guest hang before the verdict;" \
                   "this is a harness defect, not a detection result."
            else
              echo "::error::init never started - boot failed before the" \
                   "test ran; see log above"
            fi
            exit 1
          fi

          # A PASS means init reached the end, which today implies the
          # exec-gate case ran - but only because it sits before
          # pass_and_poweroff(). That is an ordering, not a guarantee,
          # and a case deleted or #if'd out of init.c would still
          # produce a perfectly green PASS. Assert the marker
          # explicitly so removing the case has to be a deliberate edit
          # here too.
          if ! grep -q "QEMU_TEST: fanotify exec gate integration check passed" \
               serial.log; then
            echo "::error::init reported PASS but the fanotify exec gate" \
                 "case (#48) never printed its marker - the case was" \
                 "skipped or removed. A green run without it is not" \
                 "coverage of the gate."
            exit 1
          fi

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: qemu-serial-log-${{ matrix.kernel_version }}
          path: tests/qemu-boot/serial.log
          if-no-files-found: warn
