name: Lint (static analysis)

# Tier 0 CI: runs the same static-analysis checks the local pre-commit
# hook runs (shellcheck, cppcheck, yamllint) unconditionally on every
# push/PR, independent of what happens to be installed on a given
# developer's machine. Pre-commit deliberately no-ops when a tool is
# missing (see its header comment) to keep commits fast, so without
# this job unlinted shell/YAML/C changes could merge freely with no
# backstop. See issue #9.
#
# cppcheck scope intentionally matches pre-commit exactly (av/ with
# warning,style,performance; userspace/avctl/ with warning,style):
# userspace/avd/ is NOT covered here because it currently reports
# style findings (redundantCondition etc.) that pre-commit never gated
# on either - widening cppcheck to avd/ is a separate cleanup, not
# part of closing #9.

on:
  push:
  pull_request:

# Nothing here pushes, comments, or writes back to the repository -
# read-only is enough, and persist-credentials: false below means
# there's no token to abuse even if a lint step somehow got
# compromised.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Install lint dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            shellcheck cppcheck yamllint

      - name: shellcheck tracked shell scripts and githooks
        run: |
          set -euo pipefail
          # Same file set pre-commit lints (tests/*.sh plus the
          # extensionless .githooks/* hooks), extended to every tracked
          # *.sh so scripts/ and packaging/ changes are covered too -
          # pre-commit's `tests/*.sh|.githooks/*` case pattern misses
          # those directories.
          mapfile -t SHFILES < <(git ls-files '*.sh' '.githooks/pre-commit' '.githooks/pre-push')
          shellcheck "${SHFILES[@]}"

      - name: cppcheck av/ (kernel module)
        run: |
          cppcheck --quiet --enable=warning,style,performance \
            --suppress=missingIncludeSystem --inline-suppr \
            --error-exitcode=1 av/

      - name: cppcheck userspace/avctl/
        run: |
          cppcheck --quiet --enable=warning,style --inline-suppr \
            --error-exitcode=1 userspace/avctl/

      - name: reject strerror(errno) next to pthread_ calls
        run: |
          set -euo pipefail
          # Issue #50: the pthread_* family returns its error number and
          # leaves errno alone, so strerror(errno) next to one prints
          # whatever was stale (usually "Success"). cppcheck does not flag
          # this, and its scope here excludes userspace/avd/ where every
          # past site lived. Deliberately narrow mechanical rule:
          # strerror(errno) in code within 10 lines after a pthread_ call
          # (the fixed sites sat 3-5 lines below their call). Scoped to
          # tracked sources via git ls-files, so untracked vendored trees
          # (tests/qemu-boot/.kernel-cache/) holding this pattern upstream
          # are not flagged. Comments are stripped before matching so the
          # explanatory "strerror(rc), not strerror(errno)" notes do not
          # read as violations; stripping tracks string/character literals
          # and backslash escapes so a "//" or "/*" inside "..." or '...'
          # neither truncates code nor opens a comment (literal contents
          # are dropped, so a strerror(errno) mentioned only inside a
          # message string cannot read as a violation either).
          # reintroducing strerror(errno) at one fixed site fails this
          # step naming file:line.
          mapfile -t CFILES < <(git ls-files '*.c' '*.h')
          awk -v window=10 '
          FNR == 1 { in_block = 0; in_str = 0; in_chr = 0; last_pthread = -1000000 }
          {
            # Char-by-char strip: comment delimiters only count outside
            # "..." / '...' (with backslash escapes honoured), and literal
            # contents never reach code. in_block/in_str/in_chr carry
            # across lines for /* ... */ and backslash-newline continuations.
            line = $0
            n = length(line)
            code = ""
            i = 1
            while (i <= n) {
              two = substr(line, i, 2)
              if (in_block) {
                if (two == "*/") { in_block = 0; i += 2 }
                else { i++ }
              } else if (in_str || in_chr) {
                if (substr(line, i, 1) == "\\") { i += 2 }
                else if (in_str && substr(line, i, 1) == "\"") { in_str = 0; i++ }
                else if (in_chr && substr(line, i, 1) == "\047") { in_chr = 0; i++ }
                else { i++ }
              } else if (two == "//") {
                break
              } else if (two == "/*") {
                in_block = 1
                i += 2
              } else {
                c = substr(line, i, 1)
                if (c == "\"") { in_str = 1; i++ }
                else if (c == "\047") { in_chr = 1; i++ }
                else { code = code c; i++ }
              }
            }
            if (match(code, /pthread_[A-Za-z_]+[ \t]*\(/)) {
              last_pthread = FNR
            }
            if (match(code, /strerror[ \t]*\([ \t]*errno[ \t]*\)/)) {
              # last_pthread > 0: never flag without a producer in this
              # file (the sentinel alone already excludes it
              # arithmetically, this states the invariant explicitly).
              if (last_pthread > 0 && FNR - last_pthread <= window) {
                printf "%s:%d: strerror(errno) within %d lines after a pthread_ call " \
                  "(line %d); pthread_* returns its error, use strerror(<rc>)\n", \
                  FILENAME, FNR, window, last_pthread
                bad = 1
              }
            }
          }
          END { exit (bad ? 1 : 0) }
          ' "${CFILES[@]}"

      - name: yamllint tracked workflows and packaging metadata
        run: |
          # Scoped to tracked YAML only: bare `yamllint .` would also
          # descend into untracked/vendored trees (tests/qemu-boot/
          # .kernel-cache/, packaging/arch/src/) that this repo does
          # not own.
          yamllint .github/workflows/ .github/dependabot.yml \
            packaging/flatpak/org.hyprav.avgui.yml
